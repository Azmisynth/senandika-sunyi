services:
  core:
    build: .
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Fill JWT_SECRET in .env}
    volumes:
      - database:/service/data
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 5s

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-18093}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.25

  tunnel:
    image: cloudflare/cloudflared:2026.6.1
    profiles: [public]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    depends_on:
      - gateway
    mem_limit: 128m
    cpus: 0.25

volumes:
  database:
